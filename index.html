<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Leitor de etiquetas — Inventário</title>
<style>
/* Leitor de etiquetas do Inventário do Galpão (TRUE).
   Hospedado fora do Apps Script (GitHub Pages) porque o HTMLService bloqueia a câmera.
   Não acessa a planilha: só lê o código e devolve o texto lido para a aba do inventário. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.camera{position:relative;flex:1;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mira{position:absolute;left:8%;right:8%;top:38%;height:24%;border:3px solid #ffffffcc;border-radius:14px;box-shadow:0 0 0 100vmax #0007}
.mira::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4d4f;opacity:.8}
.mira.ok{border-color:#32d583}
.status{position:absolute;left:0;right:0;top:16px;text-align:center;padding:0 16px;font-size:17px;font-weight:700;text-shadow:0 1px 4px #000}
.painel{background:#101828;padding:12px;display:grid;gap:10px}
.lido{display:none;background:#1d2939;border-radius:12px;padding:12px;font-size:15px;line-height:1.4}
.lido b{font-size:22px;letter-spacing:.5px;display:block;margin:4px 0}
.lido.mostrar{display:block}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,a.btn{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;min-height:54px;padding:12px;color:#fff;background:#344054;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
button.prim,a.prim{background:#155eef}
button:disabled{opacity:.45}
.oculto{display:none!important}
</style>
</head>
<body>
<div class="camera">
  <video id="video" playsinline muted></video>
  <div class="mira" id="mira"></div>
  <div class="status" id="status">Abrindo a câmera…</div>
</div>
<div class="painel">
  <div class="lido" id="lido"></div>
  <div class="linha" id="acoesLeitura">
    <button id="btnLanterna" disabled>🔦 Lanterna</button>
    <button id="btnCancelar">Cancelar</button>
  </div>
  <div class="linha oculto" id="acoesConfirmar">
    <button id="btnLerDeNovo">Ler de novo</button>
    <button class="prim" id="btnUsar">Usar este código</button>
  </div>
  <button class="prim oculto" id="btnIniciar">Iniciar câmera</button>
  <a class="btn prim oculto" id="btnVoltar" href="#">Voltar ao inventário</a>
</div>

<script>
(function(){
  // ---------------- Configuração ----------------
  // Origem da página do Apps Script que abriu o leitor (iframe do HTMLService).
  const ORIGEM_APP = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
  // Endereço do galpão: 01.03.001.01.01 (ou 11 dígitos sem pontos)
  const PADRAO_ENDERECO = /^\d{2}\.\d{2}\.\d{3}\.\d{2}\.\d{2}$/;
  const LEITURAS_IGUAIS = 2; // mesmo código lido 2 vezes seguidas antes de aceitar

  const $ = id => document.getElementById(id);
  const p = new URLSearchParams(location.hash.slice(1));
  const origem = p.get('o') || '';
  const sess = p.get('s') || '';
  const retorno = p.get('r') || '';
  const origemValida = ORIGEM_APP.test(origem);
  const retornoValido = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(retorno);

  let stream = null, detector = null, timer = null, ultimo = '', repeticoes = 0, lanterna = false, parado = false, finalizado = false;

  function status(t){ $('status').textContent = t; }
  function esc(v){ return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function normEndereco(v){
    const s = String(v || '').trim().toUpperCase().replace(/\s+/g, ' ');
    const d = s.replace(/[\s.\-\/]/g, '');
    if (/^\d{11}$/.test(d)) return [d.slice(0,2), d.slice(2,4), d.slice(4,7), d.slice(7,9), d.slice(9,11)].join('.');
    return s;
  }

  async function iniciar(){
    $('btnIniciar').classList.add('oculto');
    if (!sess) { status('Abra o leitor pelo botão "Ler" do inventário.'); return; }
    if (!('BarcodeDetector' in window)) { status('Este navegador não lê códigos de barras. Use o Chrome atualizado no Android.'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('Câmera indisponível neste navegador.'); return; }
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const pref = ['code_128','code_39','code_93','itf','codabar','ean_13','ean_8','qr_code','data_matrix'].filter(f => sup.includes(f));
      detector = new BarcodeDetector({ formats: pref.length ? pref : sup });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      const v = $('video'); v.srcObject = stream; await v.play();
      const track = stream.getVideoTracks()[0];
      const cap = track.getCapabilities ? track.getCapabilities() : {};
      $('btnLanterna').disabled = !cap.torch;
      parado = false;
      status('Aponte para o código de barras da etiqueta');
      ler();
    } catch (e) {
      pararCamera();
      status(e && e.name === 'NotAllowedError'
        ? 'Permissão da câmera negada. Toque no cadeado da barra de endereço > Permissões > Câmera > Permitir.'
        : 'Não foi possível abrir a câmera (' + (e.name || e.message || e) + ').');
      $('btnIniciar').classList.remove('oculto');
    }
  }

  async function ler(){
    if (parado || !detector) return;
    try {
      const v = $('video');
      if (v.readyState >= 2) {
        const cods = await detector.detect(v);
        const c = cods.find(x => x.rawValue && x.rawValue.trim());
        if (c) {
          const valor = normEndereco(c.rawValue);
          repeticoes = valor === ultimo ? repeticoes + 1 : 1;
          ultimo = valor;
          if (repeticoes >= LEITURAS_IGUAIS) { lido(valor); return; }
        }
      }
    } catch (e) { /* frame sem leitura */ }
    timer = setTimeout(ler, 150);
  }

  function lido(valor){
    parado = true;
    if (navigator.vibrate) navigator.vibrate(80);
    $('mira').classList.add('ok');
    if (PADRAO_ENDERECO.test(valor)) { enviar(valor); return; }
    // Código fora do padrão de endereço (ex.: local especial ou código de produto): pede confirmação
    $('lido').innerHTML = 'Código lido (não tem formato de endereço):<b>' + esc(valor) + '</b>Confira se é a etiqueta certa.';
    $('lido').classList.add('mostrar');
    $('acoesLeitura').classList.add('oculto');
    $('acoesConfirmar').classList.remove('oculto');
    $('btnUsar').onclick = () => enviar(valor);
    status('Confirme o código lido');
  }

  function enviar(valor){
    finalizado = true;
    pararCamera();
    $('lido').innerHTML = 'Endereço lido:<b>' + esc(valor) + '</b>';
    $('lido').classList.add('mostrar');
    $('acoesLeitura').classList.add('oculto');
    $('acoesConfirmar').classList.add('oculto');
    let entregue = false;
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ tipo: 'inv-endereco', sess: sess, valor: valor }, origemValida ? origem : '*');
        entregue = true;
      }
    } catch (e) { entregue = false; }

    if (entregue) {
      status('Enviado ao inventário');
      $('lido').innerHTML += 'Voltando ao inventário… Se esta aba não fechar sozinha, feche-a e volte para a aba do inventário.';
      setTimeout(() => window.close(), 300);
      return;
    }
    // Plano B: a aba do inventário não está acessível (ex.: o Chrome cortou a ligação entre as abas).
    // Abre o app de novo já com o endereço (?end=...).
    if (retornoValido) {
      const url = retorno + '?end=' + encodeURIComponent(valor);
      $('btnVoltar').href = url;
      $('btnVoltar').classList.remove('oculto');
      status('Voltando ao inventário…');
      setTimeout(() => location.replace(url), 800);
    } else {
      status('Anote o endereço e digite no inventário');
    }
  }

  function pararCamera(){
    parado = true; clearTimeout(timer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  $('btnLerDeNovo').onclick = () => {
    $('lido').classList.remove('mostrar'); $('mira').classList.remove('ok');
    $('acoesConfirmar').classList.add('oculto'); $('acoesLeitura').classList.remove('oculto');
    ultimo = ''; repeticoes = 0; parado = false;
    status('Aponte para o código de barras da etiqueta'); ler();
  };
  $('btnCancelar').onclick = () => { pararCamera(); window.close(); status('Leitura cancelada. Feche esta aba.'); };
  $('btnIniciar').onclick = iniciar;
  $('btnLanterna').onclick = async () => {
    try {
      lanterna = !lanterna;
      await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: lanterna }] });
      $('btnLanterna').textContent = lanterna ? '🔦 Desligar' : '🔦 Lanterna';
    } catch (e) { lanterna = false; }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pararCamera();
    else if (!finalizado && !stream) iniciar(); // voltou para a aba sem ter lido: reabre a câmera
  });
  window.addEventListener('hashchange', () => location.reload());

  iniciar();
})();
</script>
</body>
</html>
